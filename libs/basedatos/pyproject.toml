[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basedatos"
version = "0.1.0"
description = "Conexión a PostgreSQL por esquema y migraciones para cada servicio"
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30", "alembic>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]
