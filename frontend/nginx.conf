server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mismo origen para la web y la API: por eso la cookie puede ser SameSite=Strict.
    location /api/ {
        # Con una variable, nginx vuelve a resolver el nombre: si el gateway se recrea, sigue llegando.
        resolver 127.0.0.11 valid=10s;
        set $gateway http://gateway:8000;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Rutas de React: cualquier ruta sin archivo sirve la app.
    location / {
        try_files $uri /index.html;
    }
}
