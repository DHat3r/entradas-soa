# Valida que docker-compose.yml sea correcto usando el .env de ejemplo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preparar .env de ejemplo
        run: cp .env.example .env
      - name: Validar docker compose
        run: docker compose config -q
